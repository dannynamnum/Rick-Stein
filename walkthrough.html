<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A personal walkthrough of Rick Stein's new website by Danny Namnum." />
<title>A walkthrough · Rick Stein</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --cream: #F1EAD8;
    --warm-white: #FAF6EC;
    --dark: #2A2620;
    --dark-soft: #4A4239;
    --accent: #B89968;
    --accent-dark: #8C7048;
    --accent-light: #E6D9BD;
    --sand: #DDD2BA;
    --text-muted: #6B635A;
    --brand-cream: #F0EDE8;
    --brand-ink: #151821;
    --brand-ink-hover: #2C2A33;
    --brand-text: #3A3530;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 300; background: var(--warm-white); color: var(--dark); line-height: 1.7; padding-bottom: 64px; min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent-light); color: var(--dark); }
  .page { max-width: 480px; margin: 0 auto; padding: 28px 24px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 22px; color: var(--dark); letter-spacing: 0.04em; margin-bottom: 20px; white-space: nowrap; transition: opacity 0.3s ease; }
  .wordmark:hover { opacity: 0.85; }
  .wordmark .accent { color: var(--accent-dark); font-style: italic; font-weight: 300; }
  .eyebrow { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent-dark); font-weight: 500; margin-bottom: 20px; }
  .video-wrap { width: 100%; max-width: 360px; margin-bottom: 36px; background: #000; border-radius: 6px; overflow: hidden; box-shadow: 0 24px 60px rgba(42,38,32,0.22); }
  .video-aspect { position: relative; padding-bottom: 217.4129353233831%; height: 0; width: 100%; }
  .video-aspect iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .demo-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--accent); color: var(--warm-white); padding: 16px 32px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; border-radius: 1px; transition: all 0.3s ease; font-family: 'DM Sans', sans-serif; margin-bottom: 28px; }
  .demo-btn:hover { background: var(--accent-dark); transform: translateY(-2px); }
  .demo-btn .arrow { transition: transform 0.3s ease; display: inline-block; }
  .demo-btn:hover .arrow { transform: translateX(4px); }
  .how-link { font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; border-bottom: 1px solid rgba(184,153,104,0.35); padding-bottom: 2px; transition: color 0.3s ease, border-color 0.3s ease; margin-bottom: 40px; }
  .how-link:hover { color: var(--accent-dark); border-bottom-color: var(--accent); }
  .footer-attr { font-size: 10px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400; }
  .footer-attr .accent { color: var(--accent-dark); }
  .sticky-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: var(--brand-cream); border-top: 1px solid rgba(0,0,0,0.08); height: 64px; display: flex; align-items: center; justify-content: center; padding: 0 24px; }
  .sticky-inner { max-width: 480px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .sticky-label { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400; color: var(--brand-text); white-space: nowrap; }
  .sticky-btn { background: var(--brand-ink); color: var(--brand-cream); font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; padding: 11px 24px; border-radius: 2px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; }
  .sticky-btn:hover { background: var(--brand-ink-hover); transform: translateY(-1px); }
  .sticky-btn .arrow { transition: transform 0.3s ease; display: inline-block; }
  .sticky-btn:hover .arrow { transform: translateX(3px); }
  @media (max-width: 640px) { body { padding-bottom: 60px; } .page { padding: 24px 20px 40px; } .video-wrap { max-width: 100%; } .sticky-bar { height: 60px; padding: 0 16px; } .sticky-inner { gap: 16px; } .sticky-label { font-size: 12px; } .sticky-btn { padding: 10px 18px; font-size: 12px; } }
  @media (max-width: 380px) { .sticky-label { font-size: 11px; } .sticky-btn { padding: 9px 14px; font-size: 11px; letter-spacing: 0; } }
</style>
</head>
<body>

<main class="page">
  <a href="https://rick-stein.vercel.app/" class="wordmark" aria-label="Visit Rick Stein's demo site">
    Rick <span class="accent">Stein</span>
  </a>
  <div class="eyebrow">A personal walkthrough</div>
  <div class="video-wrap">
    <div class="video-aspect">
      <iframe src="https://www.loom.com/embed/336d2c2b2add46e998eb3c8534f41790?hide_owner=true&hide_share=true&hide_title=true&hideEmbedTopBar=true&hideLogo=true" title="Walkthrough video for Rick Stein" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
    </div>
  </div>
  <a href="https://rick-stein.vercel.app/" class="demo-btn">View Your Demo <span class="arrow">→</span></a>
  <a href="https://namnumdesign.co" class="how-link" target="_blank" rel="noopener">How this works</a>
  <p class="footer-attr">Built by <span class="accent">Namnum Design Co</span></p>
</main>

<div class="sticky-bar" role="region" aria-label="Schedule a call">
  <div class="sticky-inner">
    <span class="sticky-label">Like what you see?</span>
    <a href="https://fantastical.app/Namnum/Intro-conversation" class="sticky-btn" target="_blank" rel="noopener">Let's Talk <span class="arrow">→</span></a>
  </div>
</div>

</body>
</html>
